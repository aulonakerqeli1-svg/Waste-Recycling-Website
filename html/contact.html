<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="/css/contact.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <img src="/Img/logo.png" alt="Logo" />
    </div>
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
    <ul class="links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="types.html">Waste Types</a></li>
      <li><a href="process.html">Recycling Process</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="contact-container">
    <!-- Gjysma e majtë: foto -->
    <div class="contact-image">
      <img src="/Img/contact.jpg" alt="Recycling" />
    </div>

    <!-- Gjysma e djathtë: forma -->
    <div class="contact-card">
      <h2>Contact Us</h2>
      <p>If you have any questions about recycling or want to collaborate, feel free to reach out. We'll get back to you within 1‑2 business days.</p>
      
      <form action="#" method="post">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>

      <div class="contact-info">
        <p>Email: <a href="mailto:example@yourdomain.com">example@yourdomain.com</a></p>
        <p>Phone: +1 234 567 890</p>
      </div>
    </div>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('active');
    }
  </script>
</body>
</html>
